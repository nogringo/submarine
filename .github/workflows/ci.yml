name: CI

# Pushes to main run it through pages.yml, before the deploy.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test nostr_passwords
        working-directory: packages/nostr_passwords
        run: dart test

      - name: Test CLI
        working-directory: apps/cli
        run: dart test

      - name: Test app
        working-directory: apps/app
        run: flutter test
