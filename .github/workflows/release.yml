name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  linux:
    uses: ./.github/workflows/linux.yml

  windows:
    uses: ./.github/workflows/windows.yml

  macos:
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  cli:
    uses: ./.github/workflows/cli.yml

  release:
    needs: [ci, linux, windows, macos, android, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Fastforge artifacts keep their dist/<version>/ folder.
        run: >-
          gh release create "$GITHUB_REF_NAME" $(find dist -type f)
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
