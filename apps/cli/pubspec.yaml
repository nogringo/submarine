  ndk_sqlite3: ^0.1.1-dev.0
  nostr_passwords: ^0.2.2
  path: ^1.9.1
  sqlite3: ^3.7.0
  sync_engine_shim_for_ndk: ^0.8.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
