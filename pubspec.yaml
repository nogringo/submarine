name: submarine
description: "A nostr native password manager with emails"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  get: ^4.7.2
  intl: any
  ndk: ^0.6.0-dev.8
  ndk_rust_verifier: ^0.4.2-dev.11
  nip01: ^0.3.0+1
  nip19: ^0.2.0
  nostr_widgets: ^1.1.4
  path: ^1.9.1
  path_provider: ^2.1.5
  sembast: ^3.8.5+2
  sembast_cache_manager: ^1.0.5-dev.11
  sembast_web: ^2.4.2
  system_theme: ^3.1.2
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
