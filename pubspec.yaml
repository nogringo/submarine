name: submarine
description: "A nostr native password manager with emails"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  get: ^4.7.3
  intl: any
  ndk: ^0.8.4-dev.11
  ndk_flutter: ^0.8.4-dev.14
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.8.9+1
  sembast_web: ^2.4.5+1
  system_theme: ^3.3.0
  toastification: ^3.2.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
