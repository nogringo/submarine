version: 0.2.2
publish_to: none
repository: https://github.com/nogringo/submarine/tree/main/apps/cli

environment:
  sdk: ^3.13.4
resolution: workspace

executables:
  submarine:

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
