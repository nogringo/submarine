name: CI

# Pushes to main run it through pages.yml, before the deploy.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test nostr_passwords
        working-directory: packages/nostr_passwords
        run: dart test

      - name: Test CLI
        working-directory: apps/cli
        run: dart test

      - name: Test extension core
        working-directory: apps/extension/core
        run: dart test

      - name: Test app
        working-directory: apps/app
        run: flutter test

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Dart core is a member of the pub workspace.
      - name: Install Dart dependencies
        working-directory: .
        run: flutter pub get

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/extension/package.json
          cache: true
          cache_dependency_path: apps/extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Cache browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('apps/extension/pnpm-lock.yaml') }}

      - name: Install browsers
        run: pnpm e2e:browsers

      # Ubuntu's AppArmor keeps Chrome for Testing from sandboxing itself.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test end to end
        run: pnpm test:e2e
