name: submarine
description: "Submarine, a password manager built on Nostr."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  nostr_passwords: ^0.1.0
  url_launcher: ^6.3.3
  ndk: ^0.10.1
  ndk_flutter: ^0.10.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  sync_engine_shim_for_ndk: ^0.8.0
  ndk_drift: ^0.2.0
  local_auth: ^3.0.2
  file_picker: ^13.1.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  path_provider: ^2.1.6
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: Atkinson Hyperlegible Mono
      fonts:
        - asset: fonts/AtkinsonHyperlegibleMono-Regular.ttf
        - asset: fonts/AtkinsonHyperlegibleMono-Medium.ttf
          weight: 500
    - family: Saira Stencil One
      fonts:
        - asset: fonts/SairaStencilOne-Regular.ttf
