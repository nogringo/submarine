name: submarine_cli
description: Command-line client for Submarine, a password manager built on Nostr.
version: 0.1.0
publish_to: none
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.4
resolution: workspace

executables:
  submarine:

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  ndk: ^0.10.1
  # Not on pub.dev yet: https://github.com/relaystr/ndk/pull/882
  ndk_sqlite3:
    git:
      url: https://github.com/relaystr/ndk.git
      path: packages/sqlite3
      ref: f15fc17a8cc1a71fe5aa50159641a7444ae53902
  nostr_passwords: ^0.1.0
  path: ^1.9.1
  sqlite3: ^3.7.0
  sync_engine_shim_for_ndk: ^0.8.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
