name: Build CLI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build CLI
        working-directory: apps/cli
        run: dart build cli -o build

      - name: Package CLI
        shell: bash
        run: |
          version=$(apps/cli/build/bundle/bin/submarine --version)
          name=submarine-cli-$version-${{ matrix.platform }}
          mv apps/cli/build/bundle "$name"
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "dist/$name.zip" "$name"
          else
            tar -czf "dist/$name.tar.gz" "$name"
          fi

      - name: Upload CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: submarine-cli-${{ matrix.platform }}
          path: dist/*
