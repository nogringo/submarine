name: Build macOS package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Fastforge
        run: |
          dart pub global activate fastforge
          npm install -g appdmg

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build macOS package
        working-directory: apps/app
        env:
          # Xcode has no account here, so the pre hook signs instead.
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: >-
          fastforge package --no-version-check
          --platform macos
          --targets dmg
          --artifact-name '{{name}}-{{build_name}}-{{platform}}.{{ext}}'
          --hook-pre '../../.github/scripts/sign-macos-app.sh "$BUILD_OUTPUT_DIRECTORY/Submarine.app" macos/Runner/Release.entitlements'

      - name: Notarize macOS package
        working-directory: apps/app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          dmg=$(ls dist/*/*.dmg)
          codesign --timestamp --sign 'Developer ID Application' "$dmg"
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id 936HBZB935
          xcrun stapler staple "$dmg"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: submarine-macos
          path: apps/app/dist/*/*
