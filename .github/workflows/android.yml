name: Build Android package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Import signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/submarine.jks"
          cat > apps/app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/submarine.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=submarine
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build Android package
        working-directory: apps/app
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          mkdir dist
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk "dist/submarine-$version-android.apk"
          # Splitting drops the other ABIs of plugin libraries too; the flag keeps the versionCode of the universal APK.
          flutter build apk --release --split-per-abi --target-platform android-arm64 -P force-version-code-ignoring-abi=true
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/submarine-$version-android-arm64.apk"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: submarine-android
          path: apps/app/dist/*
