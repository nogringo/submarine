name: Build extension

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version SOURCE_CODE_REVIEW.md gives, for Firefox Add-ons to rebuild the same package.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install Dart dependencies
        working-directory: .
        run: flutter pub get --enforce-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/extension/package.json
          cache: true
          cache_dependency_path: apps/extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile the Dart core
        run: pnpm core

      - name: Zip for Chrome
        run: pnpm exec wxt zip

      - name: Zip for Firefox, with its sources
        run: pnpm exec wxt zip -b firefox

      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: submarine-extension
          path: apps/extension/.output/*.zip
          include-hidden-files: true
