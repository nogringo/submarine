name: submarine
description: "A nostr native password manager with emails"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  get: ^4.7.3
  intl: any
  ndk: 0.6.1-dev.6
  nostr_widgets: ^1.1.6
  path: ^1.9.1
  path_provider: ^2.1.5
  sembast: ^3.8.6
  sembast_cache_manager: ^1.0.5
  sembast_web: ^2.4.3
  system_theme: ^3.2.0
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
