name: Build extension

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version SOURCE_CODE_REVIEW.md gives, for Firefox Add-ons to rebuild the same package.
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install Dart dependencies
        working-directory: .
        run: flutter pub get --enforce-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/extension/package.json
          cache: true
          cache_dependency_path: apps/extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zip for Chrome
        run: pnpm zip

      # Compiles the Dart core again, without minification.
      - name: Zip for Firefox, with its sources
        run: pnpm zip:firefox

      - name: Upload extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: submarine-extension
          path: apps/extension/.output/*.zip
          include-hidden-files: true
